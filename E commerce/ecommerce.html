<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula 1 Highlights Hub - Direct Redirect</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b0c;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .main-card {
            max-width: 850px;
            margin: 0 auto;
            background-color: #141517;
            padding: 40px;
            border-radius: 12px;
            border-top: 5px solid #e10600; /* Signature F1 Red */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #a0a0a5;
            margin-bottom: 30px;
        }
        .video-card-fallback {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background-color: #1a1b1e;
            background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }
        .video-card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: background 0.3s ease;
        }
        .video-card-overlay:hover {
            background: rgba(225, 6, 0, 0.15);
        }
        .play-button-icon {
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            transition: all 0.2s ease-in-out;
        }
        .play-button-icon::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 0 12px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 5px;
        }
        .video-card-overlay:hover .play-button-icon {
            transform: scale(1.1);
            background-color: #e10600;
            border-color: #e10600;
        }
        .restriction-notice {
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .sub-notice {
            font-size: 0.85rem;
            color: #cccccc;
            margin-top: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>Grand Prix Race Analysis</h1>
        <p class="subtitle">Review track strategies, team radio insights, and mechanical setup breakdowns.</p>

        <!-- FIXED EXTERNAL REDIRECT TO SPECIFIC F1 HIGHLIGHTS VIDEO -->
        <div class="video-card-fallback">
            <a class="video-card-overlay" href="https://youtube.com" target="_blank">
                <div class="play-button-icon"></div>
                <div class="restriction-notice">Watch Full Analysis on YouTube</div>
                <div class="sub-notice">Broadcasting rights restrict external hosting. Click to watch on source app.</div>
            </a>
        </div>
    </div>

</body>
</html>
