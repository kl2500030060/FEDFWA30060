<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout - Ravella Sai Karthik</title>
    <style>
        .gridcontainer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .griditem {
            background-color: lightgreen;
            border: 2px solid darkgreen;
            padding: 40px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gridcontainer">
        <div class="griditem">1. Ravella Sai Karthik</div>
        <div class="griditem">2. ID: 2500030060</div>
        <div class="griditem">3. Grid item</div>
        <div class="griditem">4. Grid item</div>
        <div class="griditem">5. Grid item</div>
        <div class="griditem">6. Grid item</div>
    </div>
</body>
</html>
