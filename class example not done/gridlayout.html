<html lang="en">
	<head>
    		<meta charset="UTF-8">
    		<meta name="viewport" content="width=device-width, initial-scale=1.0">
    		<title>E-Commerce</title>
    		<style>
                .container {
    	display: grid;
    	grid-template-areas: 
      		"header header header"
      		"sidebar main main"
      		"footer footer footer";
    	grid-template-rows: 60px 1fr 60px;
   	grid-template-columns: 200px 1fr 1fr;
    	height: 90vh;
    	width:100vw;
  	}
  	.header {
    	grid-area: header;
    	background: #333;
    	color: white;
    	display: flex;
    	align-items: center;
    	padding: 0 20px;
  	}

  	.sidebar {
    	grid-area: sidebar;
    	background: #f4f4f4;
    	padding: 20px;
  	}
  	.footer {
    	grid-area: footer;
    	background: #333;
    	color: white;
    	text-align: center;
   	 line-height: 60px;
  	}
  	.main {
    	grid-area: main;
    	padding: 20px;
    	display: grid;
    	grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    	gap: 20px;
  	}

  	.product {
    	border: 1px solid #ddd;
    	padding: 10px;
    	text-align: center;
  	}

  	.product img {
    	width: 100%;
    	height: auto;
  	}
    body{
        margin: 0;
    }

            </style>
	</head>
	<body>

	<div class="container">

    		<div class="header">
        		<h1>E-Commerce</h1>
    		</div>

    		<div class="sidebar">
        		<ul>
            			<li>About Us</li>
            			<li>Contact </li>
            			<li>About Us</li>
            			<li>Contact </li>
            			<li>About Us</li>
            			<li>Contact</li>
        		</ul>
    		</div>

    		<div class="main">

        		<div class="product">
            			<img src="images/photo_2026-08-03_11-25-52.jpg" alt="Product 1">
            			<h4>Product 1</h4>
            			<p>$10.00</p>
        		</div>

        		<div class="product">
            			<img src="images/photo_2026-08-03_11-25-49.jpg" alt="Product 2">
            			<h4>Product 2</h4>
            			<p>$20.00</p>
        		</div>

        		<div class="product">
            			<img src="images/photo_2026-08-03_11-25-48.jpg" alt="Product 3">
            			<h4>Product 3</h4>
            			<p>$15.00</p>
        		</div>

        		<div class="product">
            			<img src="images/photo_2026-08-03_11-25-47.jpg" alt="Product 4">
            			<h4>Product 4</h4>
            			<p>$25.00</p>
        		</div>

    		</div>

    		<div class="footer">
        		&copy; E-Commerce
    		</div>
						<div class = "footer">
				&copy; KHASIM 2500030187
			</div>



	</div>

	</body>
	</html>
